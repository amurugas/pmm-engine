[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmm-engine"
version = "0.1.0"
description = "Sectional axial force and biaxial bending analysis for reinforced concrete"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PMM Engine contributors" }]
dependencies = ["reportlab>=4.4"]

[project.scripts]
pmm-engine = "pmm_engine.excel_bridge:main"
pmm-web = "pmm_engine.webapp:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=6", "pymupdf>=1.28"]
geometry = ["shapely>=2.1"]
excel = ["xlwings>=0.33"]
dxf = ["ezdxf>=1.4"]
server = ["fastapi>=0.116", "uvicorn[standard]>=0.35"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pmm_engine"]
